# Data Engineering lab pod: PostgreSQL 18 + pgAdmin 4 (Algebra Bernays University)
# Start: Podman Desktop > Pods > Play Kubernetes YAML  (or: podman kube play sql_pod.yaml)
# pgAdmin: http://localhost:8081 (admin@admin.com / admin) | PostgreSQL from your computer: localhost:5433 (myuser / mypassword)
# Databases: transactional (schemas public = online shop, raw = unvalidated imports) and dwh (star schema).
# GENERATED by lab_environment/build_sql_pod.py from lab_environment/sql/*.sql – edit the SQL files, not this YAML.
apiVersion: v1
kind: Pod
metadata:
  name: postgres-pgadmin-pod
spec:
  securityContext:
    fsGroup: 999
  containers:
    - name: postgres
      image: postgres:18
      env:
        - name: POSTGRES_USER
          value: "myuser"
        - name: POSTGRES_PASSWORD
          value: "mypassword"
        - name: POSTGRES_DB
          value: "mydatabase"
      volumeMounts:
        - mountPath: /var/lib/postgresql   # PostgreSQL 18 images keep their data under this directory
          name: postgres-data
        - mountPath: /docker-entrypoint-initdb.d/01-databases.sql
          subPath: 01-databases.sql
          name: init-sql
        - mountPath: /docker-entrypoint-initdb.d/02-transactional-schema.sql
          subPath: 02-transactional-schema.sql
          name: init-sql
        - mountPath: /docker-entrypoint-initdb.d/03-transactional-seed.sql
          subPath: 03-transactional-seed.sql
          name: init-sql
        - mountPath: /docker-entrypoint-initdb.d/04-raw-schema.sql
          subPath: 04-raw-schema.sql
          name: init-sql
        - mountPath: /docker-entrypoint-initdb.d/05-dwh-schema.sql
          subPath: 05-dwh-schema.sql
          name: init-sql
      ports:
        - containerPort: 5432   # PostgreSQL inside the pod
          hostPort: 5433        # on the host, to avoid a conflict with a local PostgreSQL
          hostIP: 127.0.0.1
    - name: pgadmin
      image: dpage/pgadmin4
      env:
        - name: PGADMIN_DEFAULT_EMAIL
          value: "admin@admin.com"
        - name: PGADMIN_DEFAULT_PASSWORD
          value: "admin"
      volumeMounts:
        - mountPath: /var/lib/pgadmin
          name: pgadmin-data
        - mountPath: /pgadmin4/servers.json   # read by pgAdmin on its first start
          subPath: servers.json
          name: pgadmin-servers
      ports:
        - containerPort: 80
          hostPort: 8081
          hostIP: 127.0.0.1
  volumes:
    - name: postgres-data
      persistentVolumeClaim:
        claimName: de-postgres18-data
    - name: pgadmin-data
      persistentVolumeClaim:
        claimName: de-pgadmin-data
    - name: init-sql
      configMap:
        name: init-sql-config
    - name: pgadmin-servers
      configMap:
        name: pgadmin-servers-config
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: de-postgres18-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: de-pgadmin-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgadmin-servers-config
data:
  servers.json: |
    {
      "Servers": {
        "1": {
          "Name": "Algebra Bernays - Data Engineering",
          "Group": "Servers",
          "Host": "localhost",
          "Port": 5432,
          "MaintenanceDB": "postgres",
          "Username": "myuser",
          "SSLMode": "prefer"
        }
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: init-sql-config
data:
  01-databases.sql: |
    -- Data Engineering lab environment – databases
    -- transactional : OLTP database of an online shop (schemas public and raw)
    -- dwh           : analytical database (star schema, filled in the ETL labs)

    CREATE DATABASE transactional;
    CREATE DATABASE dwh;
  02-transactional-schema.sql: |
    -- Data Engineering lab environment – OLTP schema of the online shop (database transactional, schema public)
    -- Naming: snake_case, tables in the singular, primary key id_<table>, foreign key <table>_id.
    -- Foreign key columns are intentionally NOT indexed – adding indexes is part of the performance labs.

    \connect transactional

    CREATE TABLE category (
        id_category    integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        category_name  varchar(50) NOT NULL UNIQUE
    );

    CREATE TABLE product (
        id_product     integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        category_id    integer NOT NULL REFERENCES category (id_category),
        sku            varchar(20) NOT NULL UNIQUE,
        product_name   varchar(100) NOT NULL,
        price          numeric(10, 2) NOT NULL CHECK (price > 0),
        active         boolean NOT NULL DEFAULT true,
        created_at     timestamp NOT NULL DEFAULT now()
    );

    CREATE TABLE customer (
        id_customer    integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        first_name     varchar(50) NOT NULL,
        last_name      varchar(50) NOT NULL,
        email          varchar(100) UNIQUE,          -- NULL allowed (customers who ordered by phone)
        phone          varchar(30),
        address        varchar(200),
        city           varchar(50),                  -- free text, as typed by the customer
        country        varchar(50),                  -- free text, as typed by the customer
        created_at     timestamp NOT NULL DEFAULT now(),
        updated_at     timestamp NOT NULL DEFAULT now()
    );

    -- "order" is a reserved word in SQL, therefore customer_order
    CREATE TABLE customer_order (
        id_customer_order  integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        customer_id        integer NOT NULL REFERENCES customer (id_customer),
        order_date         timestamp NOT NULL,
        status             varchar(20) NOT NULL DEFAULT 'created'
                           CHECK (status IN ('created', 'paid', 'shipped', 'delivered', 'cancelled', 'returned'))
    );

    CREATE TABLE order_item (
        id_order_item      integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        customer_order_id  integer NOT NULL REFERENCES customer_order (id_customer_order),
        product_id         integer NOT NULL REFERENCES product (id_product),
        quantity           integer NOT NULL CHECK (quantity > 0),
        unit_price         numeric(10, 2) NOT NULL CHECK (unit_price >= 0),   -- price actually paid (after discount)
        UNIQUE (customer_order_id, product_id)
    );

    CREATE TABLE payment (
        id_payment         integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        customer_order_id  integer NOT NULL REFERENCES customer_order (id_customer_order),
        payment_date       timestamp NOT NULL,
        payment_method     varchar(20) NOT NULL CHECK (payment_method IN ('Credit Card', 'PayPal', 'Bank Transfer')),
        amount             numeric(10, 2) NOT NULL CHECK (amount > 0),
        status             varchar(20) NOT NULL CHECK (status IN ('success', 'failed', 'refunded'))
    );

    CREATE TABLE shipment (
        id_shipment        integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        customer_order_id  integer NOT NULL REFERENCES customer_order (id_customer_order),
        shipment_date      timestamp NOT NULL,
        delivery_date      timestamp,                -- NULL while the parcel is in transit
        carrier            varchar(30) NOT NULL CHECK (carrier IN ('GLS', 'DPD', 'Hrvatska pošta', 'Overseas Express')),
        tracking_number    varchar(30) NOT NULL UNIQUE,
        status             varchar(20) NOT NULL CHECK (status IN ('in_transit', 'delivered', 'returned')),
        CHECK (delivery_date IS NULL OR delivery_date >= shipment_date)
    );

    COMMENT ON TABLE category       IS 'Product categories';
    COMMENT ON TABLE product        IS 'Products in the online shop; active = false means no longer sold';
    COMMENT ON TABLE customer       IS 'Customers; city and country are free text, so they are not always consistent';
    COMMENT ON TABLE customer_order IS 'Orders (one row per order); status shows the current state of the order';
    COMMENT ON TABLE order_item     IS 'Order lines (one row per product on an order)';
    COMMENT ON TABLE payment        IS 'Payment attempts; an order can have failed attempts, a successful payment and a refund';
    COMMENT ON TABLE shipment       IS 'Shipments of orders';
  03-transactional-seed.sql: |
    -- Data Engineering lab environment – initial data of the online shop (database transactional, schema public)
    -- The data is generated, but deterministically: setseed() makes random() return the same sequence,
    -- so every student gets exactly the same rows.
    -- Period: orders from 2024-01-01 to 2026-09-30 (growth over time + peaks before Christmas).
    -- Approx. sizes: 10 categories, 50 products, 104 customers, 500 orders, ~1.400 order lines,
    --                ~520 payments, ~460 shipments.

    \connect transactional

    SELECT setseed(0.2026);

    -- ------------------------------------------------------------------ categories and products
    INSERT INTO category (category_name) VALUES
        ('Laptops'), ('Smartphones'), ('Tablets'), ('Monitors'), ('Audio'),
        ('Accessories'), ('Gaming'), ('Smart Home'), ('Cameras'), ('Networking');

    CREATE TEMP TABLE seed_product (category_name text, product_name text, price numeric, active boolean, weight int);
    INSERT INTO seed_product VALUES
        ('Laptops',     'Lenovo IdeaPad 5 14"',          749.00, true,  6),
        ('Laptops',     'HP Pavilion 15',                 679.00, true,  5),
        ('Laptops',     'Dell XPS 13',                   1399.00, true,  3),
        ('Laptops',     'Apple MacBook Air 13" M3',      1299.00, true,  4),
        ('Laptops',     'Asus ZenBook 14 OLED',           999.00, true,  3),
        ('Smartphones', 'Samsung Galaxy S24',             899.00, true,  6),
        ('Smartphones', 'Apple iPhone 15',                999.00, true,  6),
        ('Smartphones', 'Xiaomi Redmi Note 13',           249.00, true,  7),
        ('Smartphones', 'Google Pixel 8',                 699.00, true,  3),
        ('Smartphones', 'Samsung Galaxy A35',             379.00, true,  6),
        ('Tablets',     'Apple iPad 10.9"',               449.00, true,  5),
        ('Tablets',     'Samsung Galaxy Tab S9 FE',       429.00, true,  3),
        ('Tablets',     'Lenovo Tab M10',                 179.00, true,  4),
        ('Tablets',     'Amazon Fire HD 10',              149.00, false, 1),
        ('Tablets',     'Xiaomi Pad 6',                   329.00, true,  2),
        ('Monitors',    'Dell 27" P2723D',                329.00, true,  4),
        ('Monitors',    'LG 24" 24MP400',                 129.00, true,  5),
        ('Monitors',    'Samsung Odyssey G5 32"',         349.00, true,  3),
        ('Monitors',    'AOC 27" 27G2SPU',                199.00, true,  3),
        ('Monitors',    'Philips 34" Curved',             449.00, true,  0),   -- never sold
        ('Audio',       'Sony WH-1000XM5',                349.00, true,  4),
        ('Audio',       'Apple AirPods Pro 2',            279.00, true,  6),
        ('Audio',       'JBL Flip 6',                     119.00, true,  6),
        ('Audio',       'Bose QuietComfort Earbuds',      249.00, true,  2),
        ('Audio',       'Marshall Emberton II',           169.00, true,  2),
        ('Accessories', 'USB-C Charger 65 W',              39.90, true, 12),
        ('Accessories', 'USB-C Cable 2 m',                 12.90, true, 14),
        ('Accessories', 'Laptop Backpack 15.6"',           49.90, true,  8),
        ('Accessories', 'Wireless Mouse Logitech M185',    19.90, true, 12),
        ('Accessories', 'Screen Protector',                 9.90, true, 10),
        ('Gaming',      'Sony PlayStation 5 Slim',        549.00, true,  4),
        ('Gaming',      'Nintendo Switch OLED',           349.00, true,  4),
        ('Gaming',      'Xbox Series S',                  299.00, true,  3),
        ('Gaming',      'DualSense Controller',            69.90, true,  6),
        ('Gaming',      'Gaming Headset HyperX Cloud II',  89.90, true,  4),
        ('Smart Home',  'Google Nest Mini',                49.90, true,  4),
        ('Smart Home',  'Philips Hue Starter Kit',        149.00, true,  3),
        ('Smart Home',  'TP-Link Tapo Smart Plug',         14.90, true,  6),
        ('Smart Home',  'Ring Video Doorbell',            119.00, true,  2),
        ('Smart Home',  'Xiaomi Robot Vacuum S10',        229.00, true,  3),
        ('Cameras',     'Canon EOS R50',                  799.00, true,  2),
        ('Cameras',     'GoPro HERO12 Black',             399.00, true,  3),
        ('Cameras',     'Sony ZV-1F',                     499.00, true,  1),
        ('Cameras',     'DJI Osmo Pocket 3',              539.00, true,  2),
        ('Cameras',     'Nikon Coolpix W150',             199.00, false, 0),   -- never sold, no longer offered
        ('Networking',  'TP-Link Archer AX55 Router',      99.90, true,  4),
        ('Networking',  'TP-Link Deco M4 (3-pack)',       179.00, true,  3),
        ('Networking',  'Netgear 8-Port Switch',           34.90, true,  3),
        ('Networking',  'Ubiquiti UniFi U6 Lite',         129.00, true,  0),   -- never sold
        ('Networking',  'Asus RT-AX58U',                  149.00, false, 1);

    INSERT INTO product (category_id, sku, product_name, price, active, created_at)
    SELECT c.id_category,
           upper(left(sp.category_name, 3)) || '-' || lpad(row_number() OVER (ORDER BY sp.ctid)::text, 4, '0'),
           sp.product_name, sp.price, sp.active,
           timestamp '2023-11-01' + (row_number() OVER (ORDER BY sp.ctid)) * interval '1 day'
    FROM seed_product sp
    JOIN category c ON c.category_name = sp.category_name
    ORDER BY sp.ctid;

    -- ------------------------------------------------------------------ customers
    CREATE TEMP TABLE seed_city (city text, country text);
    INSERT INTO seed_city
    SELECT city, country
    FROM (VALUES ('Zagreb', 'Croatia', 30), ('Split', 'Croatia', 12), ('Rijeka', 'Croatia', 10), ('Osijek', 'Croatia', 8),
                 ('Zadar', 'Croatia', 6), ('Pula', 'Croatia', 5), ('Varaždin', 'Croatia', 5), ('Dubrovnik', 'Croatia', 4),
                 ('Karlovac', 'Croatia', 3), ('Slavonski Brod', 'Croatia', 3), ('Ljubljana', 'Slovenia', 4),
                 ('Graz', 'Austria', 3), ('München', 'Germany', 3), ('Sarajevo', 'Bosnia and Herzegovina', 4)) AS v(city, country, w),
         generate_series(1, w);

    WITH names AS (
        SELECT ARRAY['Ana','Ivan','Marko','Petra','Luka','Maja','Josip','Ivana','Tomislav','Marija','Filip','Lucija',
                     'Matej','Sara','Antonio','Lana','Karlo','Ema','David','Nika','Nikola','Mia','Domagoj','Lea',
                     'Stjepan','Klara','Hrvoje','Iva','Dario','Helena','Mateo','Paula','Bruno','Tena','Igor','Martina',
                     'Thomas','Anna','Lukas','Sophie','Jan','Eva','Amir','Lejla','Matija','Vesna','Goran','Sanja'] AS fn,
               ARRAY['Horvat','Kovačević','Babić','Marić','Jurić','Novak','Kovačić','Knežević','Vuković','Marković',
                     'Petrović','Matić','Tomić','Pavlović','Božić','Blažević','Grgić','Pavić','Radić','Perić','Kralj',
                     'Šarić','Lovrić','Vidović','Perković','Popović','Bošnjak','Jukić','Barišić','Martinović','Müller',
                     'Schmidt','Hodžić','Begić','Zupan','Krajnc','Huber','Wagner','Galić','Filipović'] AS ln,
               ARRAY['Ilica','Vukovarska','Savska cesta','Riva','Korzo','Trg slobode','Ulica kralja Zvonimira',
                     'Frankopanska','Domovinskog rata','Put Supavla','Strossmayerova','Zagrebačka','Hauptstraße',
                     'Slovenska cesta','Ferhadija'] AS street,
               ARRAY['gmail.com','gmail.com','gmail.com','yahoo.com','outlook.com','hotmail.com','net.hr','t-com.hr','icloud.com'] AS dom,
               (SELECT array_agg(city ORDER BY ctid) FROM seed_city) AS city,
               (SELECT array_agg(country ORDER BY ctid) FROM seed_city) AS country
    ), base AS (
        SELECT i,
               fn[1 + (i * 7) % cardinality(fn)] AS first_name,
               ln[1 + (i * 11 + i / 40) % cardinality(ln)] AS last_name,
               street[1 + (i * 5) % cardinality(street)] || ' ' || (1 + (i * 17) % 120) AS address,
               dom[1 + (i * 3) % cardinality(dom)] AS domain,
               city[1 + (i * 37) % 100] AS city,
               country[1 + (i * 37) % 100] AS country,
               CASE WHEN i <= 60 THEN timestamp '2023-01-09' + (i * 5.9) * interval '1 day'
                    WHEN i <= 94 THEN timestamp '2024-01-15' + ((i - 60) * 24.5) * interval '1 day'
                    ELSE timestamp '2026-09-14' + ((i - 94) * 2) * interval '1 day' END
                 + ((i * 7919) % 600) * interval '1 minute' + interval '8 hours' AS created_at
        FROM names, generate_series(1, 100) AS i
    )
    INSERT INTO customer (first_name, last_name, email, phone, address, city, country, created_at, updated_at)
    SELECT first_name, last_name,
           CASE WHEN i IN (17, 44, 71, 98) THEN NULL                                          -- ordered by phone, no e-mail
                ELSE lower(translate(first_name || '.' || last_name, 'čćšžđüČĆŠŽĐÜ', 'ccszduCCSZDU'))
                     || CASE WHEN i > 48 THEN (i % 90)::text ELSE '' END || '@' || domain END,
           CASE WHEN i % 9 = 0 THEN NULL ELSE '+385 9' || (1 + i % 9) || ' ' || lpad(((i * 104729) % 10000000)::text, 7, '0') END,
           CASE WHEN i IN (23, 58, 86) THEN NULL ELSE address END,                            -- missing address
           CASE WHEN i IN (5, 33, 62)  THEN lower(city)
                WHEN i IN (12, 77)      THEN upper(city)
                WHEN i IN (40, 91)      THEN ' ' || city
                ELSE city END,
           CASE WHEN country <> 'Croatia' THEN country
                WHEN i IN (8, 29, 66)  THEN 'croatia'
                WHEN i IN (19, 52)     THEN 'HR'
                WHEN i IN (35, 83)     THEN 'Hrvatska'
                ELSE country END,
           created_at,
           CASE WHEN i IN (3, 14, 27, 39, 50) THEN created_at + interval '400 days' ELSE created_at END   -- moved: address/city changed later
    FROM base
    ORDER BY i;

    -- duplicate customers: the same person registered again (different spelling / e-mail case)
    INSERT INTO customer (first_name, last_name, email, phone, address, city, country, created_at, updated_at)
    SELECT CASE n WHEN 1 THEN lower(first_name) WHEN 2 THEN first_name || ' ' ELSE first_name END,
           CASE n WHEN 3 THEN upper(last_name) ELSE last_name END,
           CASE n WHEN 4 THEN NULL ELSE initcap(split_part(email, '@', 1)) || '@' || split_part(email, '@', 2) END,
           phone, address, city,
           CASE n WHEN 2 THEN 'Republic of Croatia' ELSE country END,
           timestamp '2025-05-20' + n * interval '23 days',
           timestamp '2025-05-20' + n * interval '23 days'
    FROM (SELECT c.*, row_number() OVER (ORDER BY id_customer) AS n
          FROM customer c WHERE id_customer IN (2, 10, 21, 47)) d
    ORDER BY n;

    -- ------------------------------------------------------------------ orders
    CREATE TEMP TABLE seed_order AS
    SELECT d AS order_date
    FROM (
        SELECT timestamp '2024-01-01' + power(random(), 0.8) * interval '1003 days' AS d
        FROM generate_series(1, 440)
        UNION ALL                                                -- Christmas season peaks
        SELECT make_timestamp(y, 11, 20, 0, 0, 0) + random() * interval '32 days'
        FROM generate_series(1, 30), unnest(ARRAY[2024, 2025]) AS y
        UNION ALL                                                -- orders of the last week are still in progress
        SELECT timestamp '2026-09-24' + random() * interval '6 days'
        FROM generate_series(1, 12)
    ) s;

    UPDATE seed_order                                            -- shop hours 08:00–22:00
    SET order_date = date_trunc('day', order_date) + interval '8 hours' + random() * interval '14 hours';

    -- random values are stored in a table first: a volatile expression used twice in CASE would be evaluated twice
    CREATE TEMP TABLE seed_order_r AS
    SELECT order_date, random() AS r, random() AS rc,
           date_part('day', timestamp '2026-09-30 23:59' - order_date) AS age_days
    FROM seed_order
    ORDER BY order_date;

    INSERT INTO customer_order (customer_id, order_date, status)
    SELECT pick.id_customer,
           so.order_date,
           CASE
               WHEN age_days <= 2  THEN CASE WHEN r < 0.5 THEN 'created' ELSE 'paid' END
               WHEN age_days <= 7  THEN CASE WHEN r < 0.20 THEN 'paid' WHEN r < 0.92 THEN 'shipped' ELSE 'cancelled' END
               ELSE CASE WHEN r < 0.05 THEN 'cancelled' WHEN r < 0.10 THEN 'returned' ELSE 'delivered' END
           END
    FROM seed_order_r so
    CROSS JOIN LATERAL (
        SELECT ids[1 + floor(power(so.rc, 1.5) * cardinality(ids))::int] AS id_customer
        FROM (SELECT array_agg(id_customer ORDER BY id_customer) AS ids
              FROM customer
              WHERE created_at < so.order_date
                AND id_customer <= 94) c
    ) pick
    ORDER BY so.order_date;

    -- some orders of the duplicate customers
    UPDATE customer_order o
    SET customer_id = 100 + (o.id_customer_order % 4) + 1
    WHERE o.id_customer_order IN (SELECT id_customer_order FROM customer_order
                                  WHERE order_date > timestamp '2025-10-01' AND id_customer_order % 37 = 0);

    -- ------------------------------------------------------------------ order lines
    CREATE TEMP TABLE seed_pick AS
    SELECT array_agg(p.id_product ORDER BY p.id_product) AS ids
    FROM product p
    JOIN seed_product sp ON sp.product_name = p.product_name
    CROSS JOIN generate_series(1, sp.weight);

    CREATE TEMP TABLE seed_line_count AS            -- 1–5 lines per order, mostly 1–3
    SELECT id_customer_order, 1 + floor(power(random(), 1.4) * 5)::int AS k
    FROM customer_order
    ORDER BY id_customer_order;

    CREATE TEMP TABLE seed_line AS
    SELECT lc.id_customer_order,
           (SELECT ids FROM seed_pick)[1 + floor(random() * (SELECT cardinality(ids) FROM seed_pick))::int] AS id_product
    FROM seed_line_count lc
    CROSS JOIN LATERAL generate_series(1, lc.k) AS g
    ORDER BY lc.id_customer_order, g;

    INSERT INTO order_item (customer_order_id, product_id, quantity, unit_price)
    SELECT x.id_customer_order, x.id_product,
           CASE WHEN c.category_name IN ('Accessories', 'Smart Home') THEN 1 + floor(random() * 3)::int
                WHEN random() < 0.08 THEN 2 ELSE 1 END,
           CASE WHEN random() < 0.15 THEN round(p.price * 0.9, 2) ELSE p.price END      -- 10 % discount on some lines
    FROM seed_line x
    JOIN product p ON p.id_product = x.id_product
    JOIN category c ON c.id_category = p.category_id
    ORDER BY x.id_customer_order, x.ctid
    ON CONFLICT (customer_order_id, product_id) DO NOTHING;

    -- ------------------------------------------------------------------ payments
    CREATE TEMP TABLE seed_total AS
    SELECT o.id_customer_order, o.order_date, o.status, sum(i.quantity * i.unit_price) AS total,
           random() AS r_method, random() AS r_fail
    FROM customer_order o
    JOIN order_item i ON i.customer_order_id = o.id_customer_order
    GROUP BY o.id_customer_order, o.order_date, o.status
    ORDER BY o.id_customer_order;

    ALTER TABLE seed_total ADD COLUMN method text;
    UPDATE seed_total SET method = CASE WHEN r_method < 0.55 THEN 'Credit Card' WHEN r_method < 0.80 THEN 'PayPal' ELSE 'Bank Transfer' END;

    -- data quality cases (see README): two delivered orders without payment, one payment with a wrong amount
    CREATE TEMP TABLE seed_dq AS
    SELECT 'no_payment' AS issue, id_customer_order FROM (SELECT id_customer_order FROM customer_order WHERE status = 'delivered' ORDER BY id_customer_order OFFSET 40 LIMIT 2) a
    UNION ALL
    SELECT 'wrong_amount', id_customer_order FROM (SELECT id_customer_order FROM customer_order WHERE status = 'delivered' ORDER BY id_customer_order OFFSET 120 LIMIT 1) b
    UNION ALL
    SELECT 'no_shipment', id_customer_order FROM (SELECT id_customer_order FROM customer_order WHERE status = 'delivered' ORDER BY id_customer_order OFFSET 200 LIMIT 3) c;

    -- failed card attempts before the successful payment (~8 % of paid orders) and on some cancelled orders
    INSERT INTO payment (customer_order_id, payment_date, payment_method, amount, status)
    SELECT id_customer_order,
           order_date + interval '2 minutes',
           'Credit Card', total, 'failed'
    FROM seed_total
    WHERE (status IN ('paid', 'shipped', 'delivered', 'returned') AND r_fail < 0.08)
       OR (status = 'cancelled' AND r_fail < 0.40)
    ORDER BY id_customer_order;

    INSERT INTO payment (customer_order_id, payment_date, payment_method, amount, status)
    SELECT t.id_customer_order,
           t.order_date + CASE WHEN t.method = 'Bank Transfer' THEN interval '1 day' + random() * interval '1 day'
                               ELSE interval '5 minutes' + random() * interval '20 minutes' END,
           t.method,
           CASE WHEN t.id_customer_order IN (SELECT id_customer_order FROM seed_dq WHERE issue = 'wrong_amount')
                THEN t.total - 10 ELSE t.total END,
           'success'
    FROM seed_total t
    WHERE t.status IN ('paid', 'shipped', 'delivered', 'returned')
      AND t.id_customer_order NOT IN (SELECT id_customer_order FROM seed_dq WHERE issue = 'no_payment')
    ORDER BY t.id_customer_order;

    -- ------------------------------------------------------------------ shipments
    CREATE TEMP TABLE seed_ship AS
    SELECT t.*, random() AS r1, random() AS r2, random() AS r3,
           date_trunc('day', GREATEST(t.order_date, coalesce(pmax.paid_at, t.order_date)))
             + (1 + floor(random() * 2)) * interval '1 day' + interval '9 hours' + random() * interval '6 hours' AS shipment_date
    FROM seed_total t
    LEFT JOIN (SELECT customer_order_id, max(payment_date) AS paid_at FROM payment WHERE status = 'success' GROUP BY 1) pmax
           ON pmax.customer_order_id = t.id_customer_order
    WHERE t.status IN ('shipped', 'delivered', 'returned')
      AND t.id_customer_order NOT IN (SELECT id_customer_order FROM seed_dq WHERE issue = 'no_shipment')
    ORDER BY t.id_customer_order;

    INSERT INTO shipment (customer_order_id, shipment_date, delivery_date, carrier, tracking_number, status)
    SELECT s.id_customer_order, s.shipment_date,
           CASE WHEN s.status = 'shipped' THEN NULL
                ELSE LEAST(s.shipment_date + (1 + floor(s.r2 * 5)) * interval '1 day' + s.r3 * interval '8 hours',
                           timestamp '2026-09-30 20:00') END,
           CASE WHEN s.r1 < 0.40 THEN 'GLS' WHEN s.r1 < 0.70 THEN 'DPD' WHEN s.r1 < 0.92 THEN 'Hrvatska pošta' ELSE 'Overseas Express' END,
           'TRK' || to_char(s.order_date, 'YYMMDD') || lpad(s.id_customer_order::text, 5, '0'),
           CASE s.status WHEN 'shipped' THEN 'in_transit' WHEN 'returned' THEN 'returned' ELSE 'delivered' END
    FROM seed_ship s
    ORDER BY s.id_customer_order;

    -- refunds of returned orders
    INSERT INTO payment (customer_order_id, payment_date, payment_method, amount, status)
    SELECT t.id_customer_order, sh.delivery_date + (5 + floor(random() * 10)) * interval '1 day', t.method, t.total, 'refunded'
    FROM seed_total t
    JOIN shipment sh ON sh.customer_order_id = t.id_customer_order
    WHERE t.status = 'returned'
    ORDER BY t.id_customer_order;

    DROP TABLE seed_product, seed_city, seed_order, seed_order_r, seed_pick, seed_line_count, seed_line, seed_total, seed_dq, seed_ship;

    ANALYZE;
  04-raw-schema.sql: |
    -- Data Engineering lab environment – raw landing zone (database transactional, schema raw)
    -- Data "as received" from other systems: everything is text, nothing is validated.
    -- Used in the data quality, data cleaning and ETL labs (raw -> cleaned -> dwh).
    --   raw.customer_signup : newsletter / trade fair sign-ups (CSV export)
    --   raw.product_feed    : supplier price list
    --   raw.web_event       : clickstream from the web shop (JSON, schema-on-read)

    \connect transactional

    CREATE SCHEMA raw;
    COMMENT ON SCHEMA raw IS 'Raw landing zone: unvalidated data exactly as received from source systems';

    SELECT setseed(0.42);

    -- ------------------------------------------------------------------ raw.customer_signup
    CREATE TABLE raw.customer_signup (
        load_id      integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        loaded_at    timestamp NOT NULL DEFAULT timestamp '2026-09-30 23:00',
        source_file  text,
        full_name    text,
        email        text,
        phone        text,
        city         text,
        country      text,
        signup_date  text,          -- several date formats
        channel      text
    );

    INSERT INTO raw.customer_signup (source_file, full_name, email, phone, city, country, signup_date, channel)
    SELECT 'signups_' || to_char(c.created_at, 'YYYY') || '.csv',
           CASE n % 5 WHEN 0 THEN upper(c.first_name || ' ' || c.last_name)
                      WHEN 1 THEN c.last_name || ', ' || c.first_name
                      WHEN 2 THEN '  ' || c.first_name || '  ' || c.last_name
                      ELSE c.first_name || ' ' || c.last_name END,
           CASE WHEN n IN (7, 19)  THEN replace(c.email, '@', ' at ')                    -- invalid e-mail
                WHEN n = 26        THEN split_part(c.email, '@', 1) || '@'                -- invalid e-mail
                WHEN n % 4 = 0     THEN upper(c.email)
                WHEN n % 6 = 0     THEN c.email || ' '
                ELSE c.email END,
           CASE WHEN c.phone IS NULL THEN ''
                WHEN n % 3 = 0 THEN replace(replace(c.phone, '+385 ', '0'), ' ', '')
                ELSE c.phone END,
           CASE n % 4 WHEN 0 THEN lower(c.city) WHEN 1 THEN c.city || ' ' ELSE c.city END,
           CASE WHEN c.country <> 'Croatia' THEN c.country
                ELSE (ARRAY['Croatia', 'HR', 'Hrvatska', 'croatia', 'CRO'])[1 + n % 5] END,
           CASE n % 4 WHEN 0 THEN to_char(c.created_at, 'YYYY-MM-DD')
                      WHEN 1 THEN to_char(c.created_at, 'DD.MM.YYYY.')
                      WHEN 2 THEN to_char(c.created_at, 'MM/DD/YYYY')
                      ELSE to_char(c.created_at, 'FMDD FMMonth YYYY') END,
           (ARRAY['newsletter', 'web shop', 'trade fair', 'Newsletter'])[1 + n % 4]
    FROM (SELECT c.*, row_number() OVER (ORDER BY id_customer) AS n
          FROM customer c
          WHERE c.id_customer % 3 = 1 AND c.email IS NOT NULL) c
    ORDER BY n;

    -- the same file loaded twice for a few rows (exact duplicates) + sign-ups of people who never bought anything
    INSERT INTO raw.customer_signup (source_file, full_name, email, phone, city, country, signup_date, channel)
    SELECT source_file, full_name, email, phone, city, country, signup_date, channel
    FROM raw.customer_signup WHERE load_id IN (3, 9, 15, 22)
    ORDER BY load_id;

    INSERT INTO raw.customer_signup (source_file, full_name, email, phone, city, country, signup_date, channel) VALUES
        ('signups_2026.csv', 'Mirela Jakić',    'mirela.jakic@gmail.com', '0915551234', 'Zagreb',   'Croatia', '2026-03-14',     'trade fair'),
        ('signups_2026.csv', 'Tin Vuković',     'TIN.VUKOVIC@GMAIL.COM',  '',           'zagreb',   'HR',      '14.03.2026.',    'trade fair'),
        ('signups_2026.csv', 'Lorena Bilić',    NULL,                     '098 777 1122', 'Split',  'Croatia', '03/15/2026',     'trade fair'),
        ('signups_2026.csv', NULL,              'anonymous@example.com',  NULL,         NULL,       NULL,      '2026-13-01',     'web shop'),     -- impossible date
        ('signups_2026.csv', 'Petar Perić',     'petar.peric@net.hr',     '+385 91 2345678', 'Osijek', 'Hrvatska', '2026-04-31', 'newsletter'),  -- impossible date
        ('signups_2026.csv', 'Nina Kos',        'nina.kos@outlook.com',   '+386 41 123 456', 'Ljubljana', 'Slovenia', '2 April 2026', 'web shop'),
        ('signups_2026.csv', 'test test',       'test@test.com',          '000',        'test',     'test',    '2026-05-05',     'web shop');     -- test record

    -- ------------------------------------------------------------------ raw.product_feed
    CREATE TABLE raw.product_feed (
        load_id       integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        loaded_at     timestamp NOT NULL DEFAULT timestamp '2026-09-30 23:00',
        supplier      text,
        sku           text,
        product_name  text,
        category      text,
        price_text    text,         -- several number formats and currencies
        stock_text    text,
        feed_date     text
    );

    INSERT INTO raw.product_feed (supplier, sku, product_name, category, price_text, stock_text, feed_date)
    SELECT CASE WHEN p.id_product % 2 = 0 THEN 'TechDistri d.o.o.' ELSE 'EuroGadgets GmbH' END,
           CASE WHEN p.id_product % 7 = 0 THEN lower(p.sku) ELSE p.sku END,
           CASE WHEN p.id_product % 5 = 0 THEN p.product_name || '  ' ELSE p.product_name END,
           CASE c.category_name
                WHEN 'Laptops'     THEN (ARRAY['Laptops', 'laptop', 'Notebooks', 'LAPTOPS'])[1 + p.id_product % 4]
                WHEN 'Smartphones' THEN (ARRAY['Smartphones', 'Mobile phones', 'smartphone'])[1 + p.id_product % 3]
                WHEN 'Accessories' THEN (ARRAY['Accessories', 'accessories', 'Accesories'])[1 + p.id_product % 3]   -- typo
                ELSE c.category_name END,
           CASE p.id_product % 4
                WHEN 0 THEN replace(replace(replace(to_char(p.price, 'FM999,990.00'), ',', '#'), '.', ','), '#', '.') || ' €'
                WHEN 1 THEN to_char(p.price, 'FM99990.00')
                WHEN 2 THEN 'EUR ' || replace(to_char(p.price, 'FM99990.00'), '.', ',')
                ELSE to_char(p.price, 'FM99990') END,
           (ARRAY['12', '0', 'n/a', '', '5', '-1', '120', 'on request'])[1 + floor(random() * 8)::int],
           CASE WHEN p.id_product % 2 = 0 THEN '2026-09-01' ELSE '01.09.2026.' END
    FROM product p
    JOIN category c ON c.id_category = p.category_id
    ORDER BY p.id_product;

    -- a newer price list for some products (which price is current?) and a product we do not sell
    INSERT INTO raw.product_feed (supplier, sku, product_name, category, price_text, stock_text, feed_date)
    SELECT f.supplier, f.sku, f.product_name, f.category,
           to_char(round(p.price * 1.05, 2), 'FM99990.00'), '8', '2026-09-20'
    FROM raw.product_feed f
    JOIN product p ON upper(trim(f.sku)) = p.sku
    WHERE p.id_product % 9 = 0
    ORDER BY p.id_product;

    INSERT INTO raw.product_feed (supplier, sku, product_name, category, price_text, stock_text, feed_date) VALUES
        ('EuroGadgets GmbH', 'CAM-9999', 'Insta360 X4', 'Cameras', '529,00 €', '3', '2026-09-20'),
        ('TechDistri d.o.o.', NULL,      'USB Hub 7-port', 'accessories', '24.90', '40', '2026-09-20');   -- missing SKU

    -- ------------------------------------------------------------------ raw.web_event
    CREATE TABLE raw.web_event (
        load_id    integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        loaded_at  timestamp NOT NULL DEFAULT timestamp '2026-09-30 23:00',
        payload    jsonb NOT NULL                       -- one event as JSON, structure is not guaranteed
    );

    CREATE TEMP TABLE seed_event AS
    SELECT g, random() AS r_type, random() AS r_user, random() AS r_prod, random() AS r_dev, random() AS r_utm,
           timestamp '2026-09-01' + random() * interval '29 days 23 hours' AS ts
    FROM generate_series(1, 300) AS g
    ORDER BY g;

    INSERT INTO raw.web_event (payload)
    SELECT jsonb_strip_nulls(jsonb_build_object(
               'event_id', 'ev-' || lpad(e.g::text, 5, '0'),
               'ts', CASE WHEN e.g % 10 = 0 THEN to_char(e.ts, 'DD.MM.YYYY HH24:MI')                 -- different time format
                          ELSE to_char(e.ts, 'YYYY-MM-DD"T"HH24:MI:SS"Z"') END,
               'type', CASE WHEN e.r_type < 0.70 THEN 'page_view' WHEN e.r_type < 0.92 THEN 'add_to_cart' ELSE 'purchase' END,
               'user', CASE WHEN e.r_user < 0.35 THEN NULL
                            ELSE jsonb_build_object('email', u.email, 'logged_in', true) END,
               'product', jsonb_build_object('sku', p.sku, 'price', p.price),
               'device', jsonb_build_object('type', CASE WHEN e.r_dev < 0.62 THEN 'mobile' WHEN e.r_dev < 0.95 THEN 'desktop' ELSE 'tablet' END,
                                            'os', CASE WHEN e.r_dev < 0.35 THEN 'Android' WHEN e.r_dev < 0.62 THEN 'iOS' ELSE 'Windows' END),
               'utm', CASE WHEN e.r_utm < 0.5 THEN NULL
                           ELSE jsonb_build_object('source', (ARRAY['google', 'facebook', 'newsletter', 'instagram'])[1 + floor(e.r_utm * 8)::int % 4],
                                                   'campaign', CASE WHEN e.r_utm > 0.85 THEN 'back_to_school' END) END
           ))
    FROM seed_event e
    CROSS JOIN LATERAL (SELECT email FROM customer WHERE email IS NOT NULL ORDER BY id_customer
                        OFFSET floor(e.r_user * 90)::int LIMIT 1) u
    CROSS JOIN LATERAL (SELECT sku, price FROM product WHERE active ORDER BY id_product
                        OFFSET floor(e.r_prod * 45)::int LIMIT 1) p
    ORDER BY e.g;

    DROP TABLE seed_event;
    ANALYZE;
  05-dwh-schema.sql: |
    -- Data Engineering lab environment – data warehouse (database dwh, schema public)
    -- Star schema for sales analytics. Only dim_date is filled here; the other tables are filled in the ETL labs.
    -- Grain of fact_sales: one row per order line (order_item).
    -- Dimension keys are surrogate keys (<dimension>_key); valid_from / valid_to / is_current prepare SCD type 2.

    \connect dwh

    CREATE TABLE dim_date (
        date_key                 integer PRIMARY KEY,           -- yyyymmdd, e.g. 20251224
        date_actual              date NOT NULL UNIQUE,
        day_name                 varchar(9) NOT NULL,
        day_of_week              integer NOT NULL,              -- 1 = Monday … 7 = Sunday (ISO)
        day_of_month             integer NOT NULL,
        day_of_year              integer NOT NULL,
        week_of_year_iso         integer NOT NULL,
        month_actual             integer NOT NULL,
        month_name               varchar(9) NOT NULL,
        month_name_abbreviated   char(3) NOT NULL,
        quarter_actual           integer NOT NULL,
        quarter_name             char(2) NOT NULL,              -- Q1 … Q4
        year_actual              integer NOT NULL,
        year_month               char(7) NOT NULL,              -- 2025-12
        first_day_of_month       date NOT NULL,
        last_day_of_month        date NOT NULL,
        is_weekend               boolean NOT NULL
    );

    INSERT INTO dim_date
    SELECT to_char(d, 'YYYYMMDD')::integer,
           d,
           to_char(d, 'FMDay'),
           extract(isodow FROM d),
           extract(day FROM d),
           extract(doy FROM d),
           extract(week FROM d),
           extract(month FROM d),
           to_char(d, 'FMMonth'),
           to_char(d, 'Mon'),
           extract(quarter FROM d),
           'Q' || extract(quarter FROM d),
           extract(year FROM d),
           to_char(d, 'YYYY-MM'),
           date_trunc('month', d)::date,
           (date_trunc('month', d) + interval '1 month - 1 day')::date,
           extract(isodow FROM d) IN (6, 7)
    FROM generate_series(date '2020-01-01', date '2030-12-31', interval '1 day') AS g(ts),
         LATERAL (SELECT g.ts::date AS d) x
    ORDER BY d;

    CREATE TABLE dim_customer (
        customer_key   integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        customer_id    integer NOT NULL,                        -- natural key from transactional.customer
        full_name      varchar(110) NOT NULL,
        email          varchar(100),
        city           varchar(50),
        country        varchar(50),
        valid_from     date NOT NULL DEFAULT date '2000-01-01',
        valid_to       date NOT NULL DEFAULT date '9999-12-31',
        is_current     boolean NOT NULL DEFAULT true
    );

    CREATE TABLE dim_product (
        product_key    integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        product_id     integer NOT NULL,                        -- natural key from transactional.product
        sku            varchar(20) NOT NULL,
        product_name   varchar(100) NOT NULL,
        category_name  varchar(50) NOT NULL,
        list_price     numeric(10, 2),
        valid_from     date NOT NULL DEFAULT date '2000-01-01',
        valid_to       date NOT NULL DEFAULT date '9999-12-31',
        is_current     boolean NOT NULL DEFAULT true
    );

    CREATE TABLE dim_payment_method (
        payment_method_key  integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        payment_method      varchar(20) NOT NULL UNIQUE
    );

    CREATE TABLE fact_sales (
        sales_key           bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        date_key            integer NOT NULL REFERENCES dim_date (date_key),
        customer_key        integer NOT NULL REFERENCES dim_customer (customer_key),
        product_key         integer NOT NULL REFERENCES dim_product (product_key),
        payment_method_key  integer REFERENCES dim_payment_method (payment_method_key),   -- NULL if not paid
        order_id            integer NOT NULL,                  -- degenerate dimension (order number)
        order_item_id       integer NOT NULL UNIQUE,           -- one row per order line
        order_status        varchar(20) NOT NULL,
        quantity            integer NOT NULL,
        unit_price          numeric(10, 2) NOT NULL,
        line_amount         numeric(12, 2) NOT NULL            -- quantity * unit_price
    );

    COMMENT ON TABLE fact_sales IS 'Sales fact, grain: one row per order line';
    ANALYZE;
